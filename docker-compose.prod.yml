services:
  db:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    mem_limit: 640m
    environment:
      SESSION_COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    mem_limit: 128m
    volumes:
      - ./deploy/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./about.html:/usr/share/nginx/html/about.html:ro
      - ./404.html:/usr/share/nginx/html/404.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./data/competitions.json:/usr/share/nginx/html/data/competitions.json:ro
      - ./data/brands.json:/usr/share/nginx/html/data/brands.json:ro
      - ./data/portals.json:/usr/share/nginx/html/data/portals.json:ro
      - ./data/sync_state.json:/usr/share/nginx/html/data/sync_state.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
