# 采集源唯一配置。脚本只生成审核草稿，不直接改写生产数据。

campus:
  base: "https://cxcy.njupt.edu.cn"
  user_agent: "Mozilla/5.0 (compatible; CompetitionSearchMaintainer/0.1)"
  timeout_seconds: 25
  selectors:
    item: "li.news"
    link: ".news_title a"
    date: ".news_meta"
  lists:
    - id: tzgg
      name: 通知公告
      path: /tzgg/list.htm
      priority: P0
    - id: contest_notice
      name: 学科竞赛-相关通知
      path: /15495/list.htm
      priority: P0
      allow_empty: true
    - id: dachuang_notice
      name: 大创项目-相关通知
      path: /15493/list.htm
      priority: P1
      allow_empty: true

  title_include_any:
    - 竞赛
    - 大赛
    - 挑战赛
    - 选拔
    - 蓝桥
    - 建模
    - 软件杯
    - 天梯
    - 信安
    - 互联网
    - 挑战杯
    - ACM
    - ICPC
    - CTF
    - 物联网
    - 机器人
    - 程序设计
    - 黑客松
    - hackathon
    - 创新大赛
    - 软件设计

  title_exclude_any:
    - 基金
    - 资助项目
    - 获奖
    - 成绩公示
    - 结果公示
    - 评审结果
    - 名单公示
    - 讲座
    - 培训
    - 宣讲
    - 访学
    - 研学

