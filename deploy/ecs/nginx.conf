# 竞赛查询（南邮）— 阿里云 ECS Nginx 站点配置（静态资源 + API 同机或拆分托管）
# 放置位置：/etc/nginx/sites-available/competition-search
# 启用命令：sudo ln -s /etc/nginx/sites-available/competition-search /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name njupt.cs-contest.cn cs-contest.cn;

    # 仅暴露经过 .assetsignore 过滤的纯静态发布目录，严禁直接指向含 .git / scripts / backend / .env 的源码目录
    root /var/www/competition-search;
    index index.html;
    charset utf-8;

    # 对齐 wrangler.toml 的 not_found_handling = "404-page"
    error_page 404 /404.html;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip 压缩（JSON 数据集与 CSS/JS 压缩率极高）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        image/svg+xml;

    # 生产数据 JSON：每次协商验证（ETag / Last-Modified），确保周更发布后用户刷新即拿最新数据
    location ~* ^/data/.*\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 本地字体、图标与带 ?v= 版本号的静态资源：30 天长缓存
    location ~* \.(woff2|png|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # （可选）启用本机 SQLite 浏览计数服务时取消注释，替代外网 api.counterapi.dev
    # location = /api/visits/up {
    #     proxy_pass http://127.0.0.1:9001/up;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     add_header Cache-Control "no-store" always;
    # }

    # 禁止访问任何隐藏文件（如 .git / .env）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
