<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eef8" />
  <title>页面不存在 · 竞赛查询</title>
  <meta name="description" content="该页面不存在，返回竞赛查询首页继续搜索赛事。" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css?v=20260725-04" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("compsearch-theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>

<body>
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-mesh"></div>
    <div class="bg-glow bg-glow--cyan"></div>
    <div class="bg-glow bg-glow--purple"></div>
    <div class="bg-glow bg-glow--warm"></div>
    <div class="bg-shine"></div>
    <canvas id="particle-canvas" class="bg-particles"></canvas>
    <div class="bg-noise"></div>
  </div>

  <header class="topbar">
    <a class="brand-link" href="https://www.njupt.edu.cn/" target="_blank" rel="noopener noreferrer" title="南京邮电大学">
      <img class="brand-badge" src="./assets/images/njupt-badge.png" srcset="./assets/images/njupt-badge.png 2x"
        width="240" height="64" alt="南京邮电大学校徽" decoding="async" fetchpriority="high" />
    </a>
    <nav class="nav-pill liquid-glass" aria-label="主导航">
      <a class="fluid-link" href="./index.html"><span>首页</span></a>
      <a class="fluid-link" href="./about.html"><span>关于</span></a>
    </nav>
    <div class="topbar-tools">
      <button type="button" id="theme-toggle" class="theme-toggle liquid-glass" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">暗</span>
        <span class="theme-toggle-label">夜间</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <article class="about-card liquid-glass bloom-card">
      <h1>页面不存在</h1>
      <p>
        你访问的地址在本站没有对应页面，可能是链接拼写有误或页面已被移除。赛事详情不是独立网址，需要在首页列表中打开。
      </p>
      <p style="margin-top: 1.35rem">
        <a class="btn-white" href="./index.html">返回查询</a>
      </p>
    </article>
  </main>

  <script src="./js/theme.js?v=20260724-6"></script>
  <script src="./js/particles.js?v=20260724-6"></script>
  <script>
    if (window.CompTheme) CompTheme.init();
    if (window.CompParticles) CompParticles.start(document.getElementById("particle-canvas"));
  </script>
</body>

</html>
