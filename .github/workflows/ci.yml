name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install script deps
        run: python -m pip install -r requirements-scripts.txt
      - name: Run tests and data validation
        run: npm test
      - name: Run Spring Boot tests
        working-directory: backend
        run: ./mvnw test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: bash -n deploy/remote-deploy.sh deploy/backup/*.sh
      - name: Validate Compose configuration
        run: |
          cp docker.env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
      - name: Build backend Docker image
        run: docker build -t competition-backend:ci ./backend
      - name: Build backup Docker image
        run: docker build -t competition-db-backup:ci ./deploy/backup

  # 单独一个 job：E2E 要装 chromium（约 1 分钟），不该拖慢上面的快速闸门，
  # 两者也没有依赖关系，并行跑更快拿到反馈。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: python -m unittest discover -s tests/e2e -p "test_*.py" -v
