name: Weekly competition sync

# 每周定时：采集 -> DeepSeek 审核 -> 合并 -> 校验/测试闸门 -> 通过才自动提交。
# 可靠性参考 X-daily-digest：
#   - 双 cron、非整点，避开 GitHub Actions 整点高峰
#   - schedule 若本周已成功跑过则跳过（防备用时段重复烧 API）
#   - workflow_dispatch 始终可强制跑；force=true 可忽略本周已跑守卫
# Secrets：DEEPSEEK_API_KEY（必填）；KAGGLE_USERNAME / KAGGLE_KEY（可选）

on:
  schedule:
    # 主：周一 10:17 北京 = 02:17 UTC
    - cron: "17 2 * * 1"
    # 备：周一 22:47 北京 = 14:47 UTC（主时段漏跑/严重延后时补一次）
    - cron: "47 14 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略「本周已成功」守卫，强制再跑一整轮"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Show workflow context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "force=${{ github.event.inputs.force }}"
          echo "shanghai_now=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z')"
          echo "iso_week=$(TZ=Asia/Shanghai date +%G-W%V)"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Weekly success guard
        id: weekly_guard
        shell: bash
        run: |
          set -euo pipefail
          THIS_WEEK="$(TZ=Asia/Shanghai date +%G-W%V)"
          STATE="data/sync_state.json"
          FORCE="${{ github.event.inputs.force }}"

          should_run=true
          reason="need full pipeline"

          # 对齐 X-daily：定时触发时，若本周产物已存在则跳过（备用槽不重复烧 API）
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && -f "$STATE" ]]; then
            LAST_WEEK="$(python -c "import json;print(json.load(open('data/sync_state.json',encoding='utf-8')).get('last_success_week') or '')" 2>/dev/null || true)"
            if [[ -n "$LAST_WEEK" && "$LAST_WEEK" == "$THIS_WEEK" ]]; then
              should_run=false
              reason="this week already succeeded (${THIS_WEEK}); backup slot skipped"
            fi
          fi

          # 手动触发始终跑（与 X-daily 一致）；force 仅作日志标记
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            should_run=true
            if [[ "$FORCE" == "true" ]]; then
              reason="manual force=true"
            else
              reason="manual workflow_dispatch"
            fi
          fi

          echo "this_week=${THIS_WEEK}"
          echo "should_run=${should_run} (${reason})"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "this_week=${THIS_WEEK}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.weekly_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scripts.txt

      - name: Setup Node.js
        if: steps.weekly_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install script deps
        if: steps.weekly_guard.outputs.should_run == 'true'
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-scripts.txt

      - name: Require DEEPSEEK_API_KEY
        if: steps.weekly_guard.outputs.should_run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "Need repository secret DEEPSEEK_API_KEY"
            exit 1
          }

      # 采集可能因单个列表反爬/超时报错，但仍会写出部分草稿，故不因此中断。
      # 单源失败可容忍，但「全部源都失败」必须拦截——否则旧数据照样过闸门，
      # 会把没有任何新采集的一周记成成功。汇总判定见下方 collector_health。
      - name: Collect campus drafts
        id: collect_campus
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/fetch_campus_cxcy.py

      - name: Collect Devpost drafts
        id: collect_devpost
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/fetch_devpost.py

      - name: Collect MLH drafts
        id: collect_mlh
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/fetch_mlh.py

      # Kaggle 可选：未配置 KAGGLE_USERNAME/KAGGLE_KEY 时脚本自动跳过。
      - name: Collect Kaggle drafts
        id: collect_kaggle
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/fetch_kaggle.py

      # 采集源健康汇总：未配置凭据的 Kaggle 记为 skipped，不计入分母。
      # 所有真正尝试过的源都失败时直接让 job 失败，从而跳过 write_sync_state，
      # last_success_week 保持上周，下一个 cron 槽位会重试。
      - name: Summarize collector health
        id: collector_health
        if: steps.weekly_guard.outputs.should_run == 'true'
        env:
          CAMPUS: ${{ steps.collect_campus.outcome }}
          DEVPOST: ${{ steps.collect_devpost.outcome }}
          MLH: ${{ steps.collect_mlh.outcome }}
          KAGGLE: ${{ steps.collect_kaggle.outcome }}
          KAGGLE_CONFIGURED: ${{ secrets.KAGGLE_USERNAME != '' && secrets.KAGGLE_KEY != '' }}
        run: |
          normalize() {
            case "$1" in
              success) echo "success" ;;
              skipped) echo "skipped" ;;
              *)       echo "failed" ;;
            esac
          }

          CAMPUS_R="$(normalize "$CAMPUS")"
          DEVPOST_R="$(normalize "$DEVPOST")"
          MLH_R="$(normalize "$MLH")"
          if [[ "$KAGGLE_CONFIGURED" == "true" ]]; then
            KAGGLE_R="$(normalize "$KAGGLE")"
          else
            KAGGLE_R="skipped"
          fi

          attempted=0
          succeeded=0
          for r in "$CAMPUS_R" "$DEVPOST_R" "$MLH_R" "$KAGGLE_R"; do
            [[ "$r" == "skipped" ]] && continue
            attempted=$((attempted + 1))
            [[ "$r" == "success" ]] && succeeded=$((succeeded + 1))
          done

          {
            echo "### 采集源健康"
            echo ""
            echo "| 源 | 结果 |"
            echo "| --- | --- |"
            echo "| campus | $CAMPUS_R |"
            echo "| devpost | $DEVPOST_R |"
            echo "| mlh | $MLH_R |"
            echo "| kaggle | $KAGGLE_R |"
            echo ""
            echo "尝试 $attempted 个源，成功 $succeeded 个。"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "source_campus=$CAMPUS_R"
            echo "source_devpost=$DEVPOST_R"
            echo "source_mlh=$MLH_R"
            echo "source_kaggle=$KAGGLE_R"
          } >> "$GITHUB_OUTPUT"

          if [[ "$attempted" -gt 0 && "$succeeded" -eq 0 ]]; then
            echo "::error::全部 $attempted 个采集源均失败，本周不写入成功状态。"
            exit 1
          fi
          if [[ "$succeeded" -lt "$attempted" ]]; then
            echo "::warning::$attempted 个采集源中有 $((attempted - succeeded)) 个失败，本周同步质量为 partial。"
          fi

      - name: Review drafts with DeepSeek
        if: steps.weekly_guard.outputs.should_run == 'true'
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/review_drafts.py

      - name: Apply approved competitions
        if: steps.weekly_guard.outputs.should_run == 'true'
        run: python scripts/apply_reviewed.py

      # 固定清单预计报名：官方窗口优先；仅用已核验历史推算；禁止假深链。
      # 放在 apply_reviewed 之后、validate 之前，使本周新官方日期能抑制过期预计。
      - name: Refresh registration estimates (fixed catalog)
        if: steps.weekly_guard.outputs.should_run == 'true'
        env:
          TZ: Asia/Shanghai
        run: python scripts/apply_registration_estimates.py

      # 闸门：数据不合规或测试不过则中断，不会提交。
      - name: Validate data (gate)
        if: steps.weekly_guard.outputs.should_run == 'true'
        run: python scripts/validate_data.py

      - name: Run tests (gate)
        if: steps.weekly_guard.outputs.should_run == 'true'
        run: npm test

      - name: Update weekly sync state
        if: steps.weekly_guard.outputs.should_run == 'true'
        env:
          THIS_WEEK: ${{ steps.weekly_guard.outputs.this_week }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_SOURCE: github-actions
          SOURCE_CAMPUS: ${{ steps.collector_health.outputs.source_campus }}
          SOURCE_DEVPOST: ${{ steps.collector_health.outputs.source_devpost }}
          SOURCE_MLH: ${{ steps.collector_health.outputs.source_mlh }}
          SOURCE_KAGGLE: ${{ steps.collector_health.outputs.source_kaggle }}
        run: python scripts/write_sync_state.py

      - name: Commit and push if data changed
        if: steps.weekly_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet; then
            echo "本周无数据变更（含 sync_state）。"
          else
            WEEK="$(TZ=Asia/Shanghai date +%G-W%V)"
            git commit -m "chore(data): weekly auto-sync reviewed competitions (${WEEK})"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # 外链巡检：只报告、不阻断。链接腐烂是长期数据质量问题，不该让某个官网改版
      # 或一次网络抖动中断本周的数据同步，故放在提交之后且 continue-on-error。
      # reports/ 是 gitignore 的本地产物，这里只把统计摘要留在运行记录里。
      - name: Check external links (report only)
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/check_links.py

      - name: Report link health
        if: steps.weekly_guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/summarize_link_check.py >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice
        if: steps.weekly_guard.outputs.should_run != 'true'
        run: |
          echo "Skipped: ${{ steps.weekly_guard.outputs.reason }}"
          echo "this_week=${{ steps.weekly_guard.outputs.this_week }}"
