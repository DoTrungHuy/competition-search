name: Weekly competition sync

# 每周定时：采集 -> DeepSeek 审核 -> 合并 -> 校验/测试闸门 -> 通过才自动提交。
# 需要在仓库 Settings -> Secrets and variables -> Actions 配置 DEEPSEEK_API_KEY。

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC（北京时间 10:00）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script deps
        run: python -m pip install -r requirements-scripts.txt

      # 采集可能因单个列表反爬/超时报错，但仍会写出部分草稿，故不因此中断。
      - name: Collect campus drafts
        continue-on-error: true
        run: python scripts/fetch_campus_cxcy.py

      - name: Collect Devpost drafts
        continue-on-error: true
        run: python scripts/fetch_devpost.py

      - name: Review drafts with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/review_drafts.py

      - name: Apply approved competitions
        run: python scripts/apply_reviewed.py

      # 闸门：数据不合规或测试不过则中断，不会提交。
      - name: Validate data (gate)
        run: python scripts/validate_data.py

      - name: Run tests (gate)
        run: npm test

      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "competition-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): weekly auto-sync reviewed competitions"
            git push
          else
            echo "本周无数据变更。"
          fi
