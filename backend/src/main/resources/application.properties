spring.application.name=competition-backend

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/competition_search}
spring.datasource.username=${DB_USERNAME:competition_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.placeholders.lobType=LONGTEXT

server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

competition.data-file=${COMPETITION_DATA_FILE:../data/competitions.json}
competition.data-import.enabled=${COMPETITION_DATA_IMPORT_ENABLED:true}
competition.sync-token=${SYNC_TOKEN:}
competition.admin-username=${ADMIN_USERNAME:admin}
competition.admin-password=${ADMIN_PASSWORD:}
