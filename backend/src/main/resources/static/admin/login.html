<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2ff">
  <title>管理员登录 · 竞赛查询</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="eyebrow">Competition Search</div>
      <h1>管理员登录</h1>
      <p class="muted">登录后进入竞赛候选审核工作台。</p>

      <div id="login-message" class="notice" hidden></div>

      <form id="login-form" method="post" action="/admin/login">
        <label>
          <span>用户名</span>
          <input name="username" autocomplete="username" required>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <input id="csrf-field" type="hidden" name="_csrf">
        <button class="primary-button" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script src="/admin/login.js"></script>
</body>
</html>
